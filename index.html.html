<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>現場回報系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #1f2937;
      background: #f1f5f9;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    header {
      padding: 18px;
      color: #ffffff;
      background: #0f766e;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .hidden {
      display: none !important;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      min-height: 44px;
      font: inherit;
      border-radius: 8px;
    }

    input,
    select,
    textarea {
      padding: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #5eead4;
      border-color: #0f766e;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      padding: 10px 15px;
      border: 0;
      color: #ffffff;
      background: #0f766e;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #475569;
    }

    button.warning {
      background: #c2410c;
    }

    button.light {
      color: #1f2937;
      background: #e2e8f0;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .nav,
    .actions,
    .photo-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .nav {
      margin-bottom: 16px;
    }

    .nav button,
    .actions button,
    .photo-tools button {
      width: auto;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.info {
      color: #1e3a8a;
      background: #dbeafe;
    }

    .message.success {
      color: #14532d;
      background: #dcfce7;
    }

    .message.error {
      color: #7f1d1d;
      background: #fee2e2;
    }

    .photo-status {
      margin: 8px 0;
      color: #64748b;
      font-size: 14px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 550px;
      margin: 12px 0;
      background: #111827;
      border-radius: 10px;
      object-fit: contain;
      touch-action: none;
    }

    .report {
      margin-bottom: 14px;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .report h3 {
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }

    .report p {
      margin: 6px 0;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      color: #065f46;
      background: #d1fae5;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    .muted {
      color: #64748b;
      font-size: 14px;
    }

    a {
      display: inline-block;
      padding: 10px 4px;
      color: #0f766e;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      main {
        padding: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .nav button,
      .actions button,
      .photo-tools button {
        flex: 1 1 130px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>現場回報系統</h1>
    <p id="userInfo">免登入，開啟後即可直接回報</p>
  </header>

  <main>
    <div
      id="message"
      class="message info hidden"
      role="status"
      aria-live="polite"
    ></div>

    <nav class="nav">
      <button type="button" onclick="showPage('createPage')">
        新增回報
      </button>

      <button
        type="button"
        class="secondary"
        onclick="openImprovementPage()"
      >
        改善回報
      </button>

      <button
        type="button"
        class="secondary"
        onclick="openListPage()"
      >
        回報清單
      </button>
    </nav>

    <section id="createPage" class="card page">
      <h2>新增現場回報</h2>

      <form id="reportForm">
        <div class="grid">
          <div>
            <label for="reporterName">回報人姓名 *</label>
            <input
              id="reporterName"
              maxlength="50"
              placeholder="請輸入回報人姓名"
              autocomplete="name"
              required
            >
          </div>

          <div>
            <label for="project">專案名稱 *</label>
            <input
              id="project"
              maxlength="100"
              value="亞灣社宅"
              required
            >
          </div>

          <div>
            <label for="category">回報類型 *</label>
            <select id="category" required>
              <option value="施工缺失">施工缺失</option>
              <option value="安全缺失">安全缺失</option>
              <option value="材料問題">材料問題</option>
              <option value="進度問題">進度問題</option>
              <option value="現場狀況">現場狀況</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div>
            <label for="location">現場位置 *</label>
            <input
              id="location"
              maxlength="150"
              placeholder="例如：A棟3樓浴室"
              required
            >
          </div>

          <div>
            <label for="owner">改善負責人</label>
            <input id="owner" maxlength="100">
          </div>

          <div>
            <label for="dueDate">改善期限</label>
            <input id="dueDate" type="date">
          </div>

          <div>
            <label for="severity">嚴重程度</label>
            <select id="severity">
              <option value="一般">一般</option>
              <option value="重要">重要</option>
              <option value="緊急">緊急</option>
            </select>
          </div>

          <div class="full">
            <label for="description">回報內容 *</label>
            <textarea
              id="description"
              maxlength="2000"
              placeholder="請輸入現場狀況或缺失內容"
              required
            ></textarea>
          </div>

          <div class="full">
            <label for="beforeFile">現場照片 *</label>

            <input
              id="beforeFile"
              type="file"
              accept="image/*"
              capture="environment"
              required
            >

            <p id="beforeStatus" class="photo-status">
              尚未載入照片
            </p>

            <canvas
              id="beforeCanvas"
              class="hidden"
            ></canvas>

            <div class="photo-tools">
              <button
                type="button"
                class="warning"
                onclick="selectCircleTool('before')"
              >
                圈選缺失
              </button>

              <button
                type="button"
                class="secondary"
                onclick="addPhotoText('before')"
              >
                加入文字
              </button>

              <button
                type="button"
                class="light"
                onclick="undoPhoto('before')"
              >
                復原
              </button>

              <button
                type="button"
                class="light"
                onclick="clearPhoto('before')"
              >
                清除照片
              </button>
            </div>

            <p class="muted">
              送出時會自動加入日期、專案、位置及 GPS 浮水印。
            </p>
          </div>

          <div class="full">
            <button id="submitReportButton" type="submit">
              送出現場回報
            </button>
          </div>
        </div>
      </form>
    </section>

    <section
      id="improvementPage"
      class="card page hidden"
    >
      <h2>改善完成回報</h2>

      <form id="improvementForm">
        <div class="grid">
          <div>
            <label for="improvementReporterName">
              改善回報人姓名 *
            </label>

            <input
              id="improvementReporterName"
              maxlength="50"
              placeholder="請輸入改善回報人姓名"
              autocomplete="name"
              required
            >
          </div>

          <div>
            <label for="improvementReportId">
              選擇待改善項目 *
            </label>

            <select
              id="improvementReportId"
              required
            ></select>
          </div>

          <div class="full">
            <label for="improvementNote">
              改善說明 *
            </label>

            <textarea
              id="improvementNote"
              maxlength="2000"
              placeholder="請說明改善方式及處理結果"
              required
            ></textarea>
          </div>

          <div class="full">
            <label for="afterFile">改善後照片 *</label>

            <input
              id="afterFile"
              type="file"
              accept="image/*"
              capture="environment"
              required
            >

            <p id="afterStatus" class="photo-status">
              尚未載入照片
            </p>

            <canvas
              id="afterCanvas"
              class="hidden"
            ></canvas>

            <div class="photo-tools">
              <button
                type="button"
                class="warning"
                onclick="selectCircleTool('after')"
              >
                圈選位置
              </button>

              <button
                type="button"
                class="secondary"
                onclick="addPhotoText('after')"
              >
                加入文字
              </button>

              <button
                type="button"
                class="light"
                onclick="undoPhoto('after')"
              >
                復原
              </button>

              <button
                type="button"
                class="light"
                onclick="clearPhoto('after')"
              >
                清除照片
              </button>
            </div>
          </div>

          <div class="full">
            <button
              id="submitImprovementButton"
              type="submit"
            >
              送出改善回報
            </button>
          </div>
        </div>
      </form>
    </section>

    <section
      id="listPage"
      class="card page hidden"
    >
      <div class="actions">
        <h2 style="flex: 1">回報清單</h2>

        <button
          type="button"
          class="secondary"
          onclick="loadReports()"
        >
          重新整理
        </button>
      </div>

      <div id="reportList">讀取中……</div>
    </section>
  </main>

  <script>
    const CONFIG = {
      APPS_SCRIPT_URL:
        "https://script.google.com/macros/s/AKfycbyfNW0bcT6XPt8ve0Y-zcL3AcspWbMq-_yZnh9I5bwlDrt3cCn9jgQA2DruFZXV4U0/exec",
      DEFAULT_PROJECT: "亞灣社宅",
      MAX_IMAGE_SIZE: 1600,
      JPEG_QUALITY: 0.78
    };

    let reports = [];

    const gps = {
      latitude: "",
      longitude: ""
    };

    const editors = {
      before: createEditor("before"),
      after: createEditor("after")
    };

    function createEditor(prefix) {
      return {
        prefix: prefix,
        canvas: null,
        context: null,
        loaded: false,
        tool: "",
        history: []
      };
    }

    window.addEventListener("load", function () {
      try {
        initializeEditors();
        restoreReporterName();
        locateUser();
        bindEvents();

        showMessage(
          "系統已就緒，請填寫資料並選擇照片。",
          "success"
        );

        loadReports(false);
      } catch (error) {
        console.error(error);

        showMessage(
          "系統初始化失敗：" + getErrorMessage(error),
          "error"
        );
      }
    });

    function bindEvents() {
      document
        .getElementById("reportForm")
        .addEventListener("submit", submitReport);

      document
        .getElementById("improvementForm")
        .addEventListener("submit", submitImprovement);

      document
        .getElementById("beforeFile")
        .addEventListener("change", function (event) {
          loadPhoto("before", event);
        });

      document
        .getElementById("afterFile")
        .addEventListener("change", function (event) {
          loadPhoto("after", event);
        });

      document
        .getElementById("reporterName")
        .addEventListener("change", rememberCreateReporter);

      document
        .getElementById("improvementReporterName")
        .addEventListener(
          "change",
          rememberImprovementReporter
        );
    }

    function restoreReporterName() {
      const savedName =
        localStorage.getItem("yawanReporterName") || "";

      document.getElementById("reporterName").value =
        savedName;

      document.getElementById(
        "improvementReporterName"
      ).value = savedName;

      updateUserInfo(savedName);
    }

    function rememberCreateReporter() {
      const name = getValue("reporterName");

      saveReporterName(name);

      document.getElementById(
        "improvementReporterName"
      ).value = name;
    }

    function rememberImprovementReporter() {
      const name =
        getValue("improvementReporterName");

      saveReporterName(name);

      document.getElementById("reporterName").value =
        name;
    }

    function saveReporterName(name) {
      if (!name) {
        return;
      }

      localStorage.setItem(
        "yawanReporterName",
        name
      );

      updateUserInfo(name);
    }

    function updateUserInfo(name) {
      document.getElementById("userInfo").textContent =
        name
          ? "目前填報人：" +
            name +
            "｜免登入直接回報"
          : "免登入，開啟後即可直接回報";
    }

    function getCurrentReporterName() {
      return (
        getValue("reporterName") ||
        getValue("improvementReporterName") ||
        localStorage.getItem("yawanReporterName") ||
        "現場人員"
      );
    }

    function initializeEditors() {
      Object.keys(editors).forEach(function (prefix) {
        const editor = editors[prefix];

        editor.canvas =
          document.getElementById(prefix + "Canvas");

        if (!editor.canvas) {
          throw new Error(
            "找不到照片畫布：" + prefix
          );
        }

        editor.context =
          editor.canvas.getContext("2d");

        editor.canvas.addEventListener(
          "pointerdown",
          function (event) {
            drawCircle(prefix, event);
          }
        );
      });
    }

    function setPhotoStatus(prefix, text, isError) {
      const element =
        document.getElementById(prefix + "Status");

      if (!element) {
        return;
      }

      element.textContent = text;
      element.style.color =
        isError ? "#b91c1c" : "#64748b";
    }

    function loadPhoto(prefix, event) {
      const input = event.target;
      const file =
        input.files && input.files[0];

      if (!file) {
        setPhotoStatus(
          prefix,
          "尚未載入照片",
          false
        );
        return;
      }

      if (
        !file.type ||
        !file.type.startsWith("image/")
      ) {
        input.value = "";

        setPhotoStatus(
          prefix,
          "檔案格式不正確",
          true
        );

        showMessage(
          "請選擇 JPG、PNG 或手機照片。",
          "error"
        );
        return;
      }

      setPhotoStatus(
        prefix,
        "正在讀取照片：" + file.name,
        false
      );

      showMessage(
        "正在讀取照片，請稍候……",
        "info"
      );

      const imageUrl =
        URL.createObjectURL(file);

      const image = new Image();

      image.onload = function () {
        try {
          const editor = editors[prefix];

          const sourceWidth =
            image.naturalWidth || image.width;

          const sourceHeight =
            image.naturalHeight || image.height;

          if (
            !sourceWidth ||
            !sourceHeight
          ) {
            throw new Error(
              "無法取得照片尺寸。"
            );
          }

          const ratio = Math.min(
            1,
            CONFIG.MAX_IMAGE_SIZE /
              Math.max(
                sourceWidth,
                sourceHeight
              )
          );

          editor.canvas.width =
            Math.max(
              1,
              Math.round(
                sourceWidth * ratio
              )
            );

          editor.canvas.height =
            Math.max(
              1,
              Math.round(
                sourceHeight * ratio
              )
            );

          editor.context =
            editor.canvas.getContext("2d");

          editor.context.clearRect(
            0,
            0,
            editor.canvas.width,
            editor.canvas.height
          );

          editor.context.drawImage(
            image,
            0,
            0,
            editor.canvas.width,
            editor.canvas.height
          );

          editor.loaded = true;
          editor.tool = "";
          editor.history = [];

          editor.canvas.classList.remove(
            "hidden"
          );

          setPhotoStatus(
            prefix,
            "照片已載入：" +
              file.name +
              "（" +
              editor.canvas.width +
              " × " +
              editor.canvas.height +
              "）",
            false
          );

          showMessage(
            "照片已載入，可圈選缺失或加入文字。",
            "success"
          );
        } catch (error) {
          console.error(error);

          input.value = "";

          editors[prefix].loaded = false;
          editors[prefix].canvas.classList.add(
            "hidden"
          );

          setPhotoStatus(
            prefix,
            "照片處理失敗",
            true
          );

          showMessage(
            "照片處理失敗：" +
              getErrorMessage(error),
            "error"
          );
        } finally {
          URL.revokeObjectURL(imageUrl);
        }
      };

      image.onerror = function () {
        URL.revokeObjectURL(imageUrl);
        input.value = "";

        editors[prefix].loaded = false;
        editors[prefix].canvas.classList.add(
          "hidden"
        );

        setPhotoStatus(
          prefix,
          "瀏覽器無法讀取此照片",
          true
        );

        showMessage(
          "瀏覽器無法開啟這張照片。請改用 JPG、PNG，或先將照片截圖後再上傳。",
          "error"
        );
      };

      image.src = imageUrl;
    }

    function drawCircle(prefix, event) {
      const editor = editors[prefix];

      if (
        !editor.loaded ||
        editor.tool !== "circle"
      ) {
        return;
      }

      event.preventDefault();

      saveHistory(prefix);

      const rect =
        editor.canvas.getBoundingClientRect();

      const scaleX =
        editor.canvas.width / rect.width;

      const scaleY =
        editor.canvas.height / rect.height;

      const x =
        (event.clientX - rect.left) * scaleX;

      const y =
        (event.clientY - rect.top) * scaleY;

      const radius = Math.max(
        35,
        editor.canvas.width * 0.06
      );

      editor.context.beginPath();

      editor.context.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
      );

      editor.context.strokeStyle = "#ff0000";

      editor.context.lineWidth = Math.max(
        6,
        editor.canvas.width * 0.008
      );

      editor.context.stroke();

      editor.tool = "";

      showMessage(
        "已加入紅色圈選。",
        "success"
      );
    }

    function selectCircleTool(prefix) {
      const editor = editors[prefix];

      if (!editor.loaded) {
        showMessage(
          "請先選擇並成功載入照片。",
          "error"
        );
        return;
      }

      editor.tool = "circle";

      showMessage(
        "請在照片上點一下要圈選的位置。",
        "info"
      );
    }

    function addPhotoText(prefix) {
      const editor = editors[prefix];

      if (!editor.loaded) {
        showMessage(
          "請先選擇並成功載入照片。",
          "error"
        );
        return;
      }

      const text = window.prompt(
        "請輸入照片標註文字："
      );

      if (!text || !text.trim()) {
        return;
      }

      saveHistory(prefix);

      const fontSize = Math.max(
        28,
        editor.canvas.width * 0.035
      );

      const x =
        editor.canvas.width * 0.04;

      const y =
        editor.canvas.height * 0.1;

      editor.context.font =
        "bold " +
        fontSize +
        "px sans-serif";

      editor.context.lineWidth =
        Math.max(4, fontSize * 0.12);

      editor.context.strokeStyle =
        "rgba(0,0,0,0.9)";

      editor.context.fillStyle =
        "#ffff00";

      editor.context.strokeText(
        text.trim(),
        x,
        y
      );

      editor.context.fillText(
        text.trim(),
        x,
        y
      );

      showMessage(
        "已加入照片文字。",
        "success"
      );
    }

    function saveHistory(prefix) {
      const editor = editors[prefix];

      editor.history.push(
        editor.canvas.toDataURL(
          "image/jpeg",
          0.85
        )
      );

      if (editor.history.length > 10) {
        editor.history.shift();
      }
    }

    function undoPhoto(prefix) {
      const editor = editors[prefix];

      if (!editor.history.length) {
        showMessage(
          "沒有可以復原的操作。",
          "info"
        );
        return;
      }

      const image = new Image();

      image.onload = function () {
        editor.context.clearRect(
          0,
          0,
          editor.canvas.width,
          editor.canvas.height
        );

        editor.context.drawImage(
          image,
          0,
          0,
          editor.canvas.width,
          editor.canvas.height
        );

        showMessage(
          "已復原上一個照片操作。",
          "success"
        );
      };

      image.src = editor.history.pop();
    }

    function clearPhoto(prefix) {
      const editor = editors[prefix];

      if (
        editor.canvas &&
        editor.context
      ) {
        editor.context.clearRect(
          0,
          0,
          editor.canvas.width,
          editor.canvas.height
        );
      }

      editor.loaded = false;
      editor.tool = "";
      editor.history = [];

      if (editor.canvas) {
        editor.canvas.classList.add(
          "hidden"
        );
      }

      const input =
        document.getElementById(prefix + "File");

      if (input) {
        input.value = "";
      }

      setPhotoStatus(
        prefix,
        "尚未載入照片",
        false
      );
    }

    function createFinalPhoto(
      prefix,
      project,
      location
    ) {
      const editor = editors[prefix];

      if (!editor.loaded) {
        throw new Error(
          prefix === "before"
            ? "現場照片尚未成功載入。"
            : "改善後照片尚未成功載入。"
        );
      }

      const output =
        document.createElement("canvas");

      output.width =
        editor.canvas.width;

      output.height =
        editor.canvas.height;

      const context =
        output.getContext("2d");

      context.drawImage(
        editor.canvas,
        0,
        0
      );

      const fontSize = Math.max(
        20,
        output.width * 0.024
      );

      const padding = Math.max(
        12,
        output.width * 0.015
      );

      const lineHeight =
        fontSize * 1.35;

      const boxHeight =
        lineHeight * 4 +
        padding * 2;

      context.fillStyle =
        "rgba(0,0,0,0.68)";

      context.fillRect(
        0,
        Math.max(
          0,
          output.height - boxHeight
        ),
        output.width,
        boxHeight
      );

      context.fillStyle = "#ffffff";

      context.font =
        "bold " +
        fontSize +
        "px sans-serif";

      const dateText =
        new Intl.DateTimeFormat(
          "zh-TW",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        ).format(new Date());

      const gpsText =
        gps.latitude &&
        gps.longitude
          ? "GPS：" +
            gps.latitude +
            ", " +
            gps.longitude
          : "GPS：未取得";

      const lines = [
        "日期：" + dateText,
        "專案：" + project,
        "位置：" + location,
        gpsText
      ];

      lines.forEach(
        function (line, index) {
          context.fillText(
            line,
            padding,
            output.height -
              boxHeight +
              padding +
              fontSize +
              index * lineHeight,
            output.width -
              padding * 2
          );
        }
      );

      const dataUrl =
        output.toDataURL(
          "image/jpeg",
          CONFIG.JPEG_QUALITY
        );

      if (
        !dataUrl ||
        !dataUrl.startsWith(
          "data:image/jpeg;base64,"
        )
      ) {
        throw new Error(
          "照片轉換失敗，請重新選擇照片。"
        );
      }

      return dataUrl;
    }

    function locateUser() {
      if (!navigator.geolocation) {
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          gps.latitude =
            position.coords.latitude.toFixed(6);

          gps.longitude =
            position.coords.longitude.toFixed(6);
        },
        function () {
          gps.latitude = "";
          gps.longitude = "";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    async function submitReport(event) {
      event.preventDefault();

      const button =
        document.getElementById(
          "submitReportButton"
        );

      button.disabled = true;

      try {
        const reporterName =
          getValue("reporterName");

        const project =
          getValue("project");

        const category =
          getValue("category");

        const location =
          getValue("location");

        const description =
          getValue("description");

        if (!reporterName) {
          throw new Error(
            "請輸入回報人姓名。"
          );
        }

        if (!project) {
          throw new Error(
            "請輸入專案名稱。"
          );
        }

        if (!category) {
          throw new Error(
            "請選擇回報類型。"
          );
        }

        if (!location) {
          throw new Error(
            "請輸入現場位置。"
          );
        }

        if (!description) {
          throw new Error(
            "請輸入回報內容。"
          );
        }

        if (!editors.before.loaded) {
          throw new Error(
            "照片尚未成功載入，請重新選擇照片。"
          );
        }

        saveReporterName(reporterName);

        showMessage(
          "正在整理照片，請勿關閉網頁……",
          "info"
        );

        const photo =
          createFinalPhoto(
            "before",
            project,
            location
          );

        showMessage(
          "正在上傳照片並建立回報，請稍候……",
          "info"
        );

        const result = await callApi(
          "createReport",
          {
            reporterName: reporterName,
            project: project,
            category: category,
            location: location,
            description: description,
            owner: getValue("owner"),
            dueDate: getValue("dueDate"),
            severity:
              getValue("severity") ||
              "一般",
            latitude: gps.latitude,
            longitude: gps.longitude,
            photo: photo
          }
        );

        document
          .getElementById("reportForm")
          .reset();

        document.getElementById(
          "reporterName"
        ).value = reporterName;

        document.getElementById(
          "project"
        ).value =
          CONFIG.DEFAULT_PROJECT;

        clearPhoto("before");

        await loadReports(false);
        showPage("listPage");

        showMessage(
          "回報建立成功，編號：" +
            result.reportId,
          "success"
        );
      } catch (error) {
        console.error(error);

        showMessage(
          getErrorMessage(error),
          "error"
        );
      } finally {
        button.disabled = false;
      }
    }

    async function submitImprovement(event) {
      event.preventDefault();

      const button =
        document.getElementById(
          "submitImprovementButton"
        );

      button.disabled = true;

      try {
        const reporterName =
          getValue(
            "improvementReporterName"
          );

        const reportId =
          getValue(
            "improvementReportId"
          );

        const improvementNote =
          getValue(
            "improvementNote"
          );

        if (!reporterName) {
          throw new Error(
            "請輸入改善回報人姓名。"
          );
        }

        if (!reportId) {
          throw new Error(
            "請選擇待改善項目。"
          );
        }

        if (!improvementNote) {
          throw new Error(
            "請輸入改善說明。"
          );
        }

        if (!editors.after.loaded) {
          throw new Error(
            "改善後照片尚未成功載入，請重新選擇照片。"
          );
        }

        const report =
          reports.find(
            function (item) {
              return (
                item.reportId ===
                reportId
              );
            }
          );

        if (!report) {
          throw new Error(
            "找不到指定的回報資料。"
          );
        }

        saveReporterName(reporterName);

        showMessage(
          "正在整理改善照片，請勿關閉網頁……",
          "info"
        );

        const photo =
          createFinalPhoto(
            "after",
            report.project,
            report.location
          );

        showMessage(
          "正在上傳改善資料，請稍候……",
          "info"
        );

        await callApi(
          "completeImprovement",
          {
            reporterName: reporterName,
            reportId: reportId,
            improvementNote:
              improvementNote,
            latitude: gps.latitude,
            longitude: gps.longitude,
            photo: photo
          }
        );

        document
          .getElementById(
            "improvementForm"
          )
          .reset();

        document.getElementById(
          "improvementReporterName"
        ).value = reporterName;

        clearPhoto("after");

        await loadReports(false);
        showPage("listPage");

        showMessage(
          "改善回報完成。",
          "success"
        );
      } catch (error) {
        console.error(error);

        showMessage(
          getErrorMessage(error),
          "error"
        );
      } finally {
        button.disabled = false;
      }
    }

    async function loadReports(showLoading) {
      try {
        if (showLoading !== false) {
          showMessage(
            "正在讀取回報資料……",
            "info"
          );
        }

        const result =
          await callApi(
            "listReports",
            {}
          );

        reports =
          Array.isArray(result.reports)
            ? result.reports
            : [];

        renderReports();
        updateImprovementOptions();

        if (showLoading !== false) {
          showMessage(
            "已讀取 " +
              reports.length +
              " 筆資料。",
            "success"
          );
        }
      } catch (error) {
        console.error(error);

        document.getElementById(
          "reportList"
        ).innerHTML =
          "<p>無法讀取回報資料。</p>";

        if (showLoading !== false) {
          showMessage(
            getErrorMessage(error),
            "error"
          );
        }
      }
    }

    function renderReports() {
      const container =
        document.getElementById(
          "reportList"
        );

      if (!reports.length) {
        container.innerHTML =
          "<p>目前沒有回報資料。</p>";
        return;
      }

      container.innerHTML =
        reports
          .map(function (report) {
            const encodedId =
              encodeURIComponent(
                report.reportId || ""
              );

            const improvementLink =
              report.improvementPdfUrl
                ? (
                  '<a href="' +
                  escapeHtml(
                    report.improvementPdfUrl
                  ) +
                  '" target="_blank" rel="noopener noreferrer">' +
                  "下載改善報告</a>"
                )
                : "";

            const acceptanceLink =
              report.acceptancePdfUrl
                ? (
                  '<a href="' +
                  escapeHtml(
                    report.acceptancePdfUrl
                  ) +
                  '" target="_blank" rel="noopener noreferrer">' +
                  "下載驗收單</a>"
                )
                : "";

            const acceptanceButton =
              report.improvementNote
                ? (
                  '<button type="button" ' +
                  'class="secondary" ' +
                  'data-pdf-id="' +
                  encodedId +
                  '" ' +
                  'data-pdf-type="acceptance">' +
                  "驗收單 PDF" +
                  "</button>"
                )
                : "";

            return (
              '<article class="report">' +

                "<h3>" +
                  escapeHtml(
                    report.reportId
                  ) +
                  "｜" +
                  escapeHtml(
                    report.project
                  ) +
                "</h3>" +

                '<p><span class="badge">' +
                  escapeHtml(
                    report.status
                  ) +
                "</span> " +
                  escapeHtml(
                    report.category
                  ) +
                  "／" +
                  escapeHtml(
                    report.severity
                  ) +
                "</p>" +

                "<p><strong>位置：</strong>" +
                  escapeHtml(
                    report.location
                  ) +
                "</p>" +

                "<p><strong>內容：</strong>" +
                  escapeHtml(
                    report.description
                  ) +
                "</p>" +

                "<p><strong>負責人：</strong>" +
                  escapeHtml(
                    report.owner ||
                    "未指定"
                  ) +
                "</p>" +

                "<p><strong>期限：</strong>" +
                  escapeHtml(
                    report.dueDate ||
                    "未設定"
                  ) +
                "</p>" +

                "<p><strong>回報人：</strong>" +
                  escapeHtml(
                    report.createdByName ||
                    "現場人員"
                  ) +
                "</p>" +

                "<p><strong>建立時間：</strong>" +
                  escapeHtml(
                    report.createdAt
                  ) +
                "</p>" +

                (
                  report.improvementNote
                    ? (
                      "<p><strong>改善說明：</strong>" +
                      escapeHtml(
                        report.improvementNote
                      ) +
                      "</p>"
                    )
                    : ""
                ) +

                (
                  report.improvedByName
                    ? (
                      "<p><strong>改善回報人：</strong>" +
                      escapeHtml(
                        report.improvedByName
                      ) +
                      "</p>"
                    )
                    : ""
                ) +

                (
                  report.improvedAt
                    ? (
                      "<p><strong>改善時間：</strong>" +
                      escapeHtml(
                        report.improvedAt
                      ) +
                      "</p>"
                    )
                    : ""
                ) +

                '<div class="actions">' +

                  '<button type="button" ' +
                  'data-pdf-id="' +
                  encodedId +
                  '" ' +
                  'data-pdf-type="improvement">' +
                  "缺失改善報告 PDF" +
                  "</button>" +

                  acceptanceButton +
                  improvementLink +
                  acceptanceLink +

                "</div>" +
              "</article>"
            );
          })
          .join("");

      container
        .querySelectorAll(
          "[data-pdf-id]"
        )
        .forEach(function (button) {
          button.addEventListener(
            "click",
            function () {
              createPdf(
                decodeURIComponent(
                  button.dataset.pdfId
                ),
                button.dataset.pdfType,
                button
              );
            }
          );
        });
    }

    function updateImprovementOptions() {
      const select =
        document.getElementById(
          "improvementReportId"
        );

      const selectedValue =
        select.value;

      const available =
        reports.filter(
          function (report) {
            return (
              report.status !==
                "已完成" &&
              report.status !==
                "已驗收"
            );
          }
        );

      if (!available.length) {
        select.innerHTML =
          '<option value="">' +
          "目前沒有待改善項目" +
          "</option>";
        return;
      }

      select.innerHTML =
        '<option value="">' +
        "請選擇回報項目" +
        "</option>" +
        available
          .map(function (report) {
            return (
              '<option value="' +
              escapeHtml(
                report.reportId
              ) +
              '">' +
              escapeHtml(
                report.reportId +
                  "｜" +
                  report.project +
                  "｜" +
                  report.location
              ) +
              "</option>"
            );
          })
          .join("");

      if (
        available.some(
          function (report) {
            return (
              report.reportId ===
              selectedValue
            );
          }
        )
      ) {
        select.value =
          selectedValue;
      }
    }

    async function createPdf(
      reportId,
      reportType,
      button
    ) {
      if (button) {
        button.disabled = true;
      }

      const documentName =
        reportType === "acceptance"
          ? "驗收單"
          : "缺失改善報告";

      /*
       * 必須在使用者按下按鈕時先開啟空白頁，
       * 避免非同步作業完成後被瀏覽器阻擋。
       */
      const pdfWindow =
        window.open(
          "about:blank",
          "_blank"
        );

      try {
        showMessage(
          "正在產生" +
            documentName +
            "，請稍候……",
          "info"
        );

        const result =
          await callApi(
            "createPdf",
            {
              reporterName:
                getCurrentReporterName(),
              reportId: reportId,
              reportType: reportType
            }
          );

        await loadReports(false);

        showMessage(
          documentName +
            "已產生。",
          "success"
        );

        if (pdfWindow) {
          pdfWindow.location.href =
            result.url;
        } else {
          showMessage(
            documentName +
              "已產生，請按清單中的下載連結。",
            "success"
          );
        }
      } catch (error) {
        console.error(error);

        if (
          pdfWindow &&
          !pdfWindow.closed
        ) {
          pdfWindow.close();
        }

        showMessage(
          getErrorMessage(error),
          "error"
        );
      } finally {
        if (button) {
          button.disabled = false;
        }
      }
    }

    async function callApi(action, data) {
      if (
        !CONFIG.APPS_SCRIPT_URL ||
        !CONFIG.APPS_SCRIPT_URL.startsWith(
          "https://script.google.com/"
        )
      ) {
        throw new Error(
          "Apps Script API 網址設定錯誤。"
        );
      }

      const requestData =
        Object.assign(
          {},
          data || {}
        );

      if (!requestData.reporterName) {
        requestData.reporterName =
          getCurrentReporterName();
      }

      let response;

      try {
        response = await fetch(
          CONFIG.APPS_SCRIPT_URL,
          {
            method: "POST",
            redirect: "follow",
            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action: action,
              data: requestData
            })
          }
        );
      } catch (error) {
        console.error(error);

        throw new Error(
          "無法連線至後端。請檢查網路、Apps Script 網址及部署權限。"
        );
      }

      const text =
        await response.text();

      if (!response.ok) {
        throw new Error(
          "後端連線失敗：HTTP " +
            response.status +
            "。" +
            text.substring(0, 150)
        );
      }

      let result;

      try {
        result = JSON.parse(text);
      } catch (error) {
        console.error(
          "後端原始回應：",
          text
        );

        throw new Error(
          "後端沒有回傳有效 JSON。請確認 Apps Script 已部署為「任何人」可存取。"
        );
      }

      if (!result.ok) {
        throw new Error(
          result.message ||
          "操作失敗。"
        );
      }

      return result;
    }

    function openImprovementPage() {
      updateImprovementOptions();

      const savedName =
        localStorage.getItem(
          "yawanReporterName"
        ) || "";

      if (savedName) {
        document.getElementById(
          "improvementReporterName"
        ).value = savedName;
      }

      showPage("improvementPage");
    }

    async function openListPage() {
      showPage("listPage");
      await loadReports();
    }

    function showPage(pageId) {
      document
        .querySelectorAll(".page")
        .forEach(function (element) {
          element.classList.add(
            "hidden"
          );
        });

      const page =
        document.getElementById(
          pageId
        );

      if (page) {
        page.classList.remove(
          "hidden"
        );
      }
    }

    function showMessage(text, type) {
      const element =
        document.getElementById(
          "message"
        );

      element.textContent =
        text || "";

      element.className =
        "message " +
        (type || "info");

      element.classList.remove(
        "hidden"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function getValue(id) {
      const element =
        document.getElementById(id);

      return element
        ? String(
            element.value || ""
          ).trim()
        : "";
    }

    function getErrorMessage(error) {
      if (!error) {
        return "發生未知錯誤。";
      }

      return (
        error.message ||
        String(error)
      );
    }

    function escapeHtml(value) {
      return String(
        value == null
          ? ""
          : value
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
